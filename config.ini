; ==========================================================
;  AX6 全自动刷机脚本 配置文件
;  修改后重新运行 run_ax6_auto.bat 即可生效
;
;  注意：不要把真实的密码提交到公开仓库。
;        留空时会使用注释里标注的默认值。
; ==========================================================

[paths]
; 相对路径以本文件所在目录为基准
; 所需固件统一放在 files/ 下（仓库不附带，请自行准备）
stock_firmware = files/miwifi_ra69_firmware_45a77_1.0.18.bin
transition_firmware = files/xiaomimtd12.bin
mibib = files/ax6-uboot-mibib.bin
uboot = files/uboot-ax6.bin
immortalwrt_factory = files/immortalwrt-25.12.2-qualcommax-ipq807x-redmi_ax6-stock-squashfs-factory.ubi

[network]
; 小米原厂固件地址
stock_ip = 192.168.31.1
; 过渡固件 / U-Boot / ImmortalWrt 地址
router_ip = 192.168.1.1
; 刷机时临时加在电脑网卡上的地址（U-Boot 需要）
pc_ip = 192.168.1.10
netmask = 255.255.255.0

[credentials]
; 原厂固件 SSH 的用户名 / 密码（留空 = root / root）
stock_ssh_user =
stock_ssh_password =
; 路由器后台（Web）管理密码；用于自动解锁 SSH（调用 XMiR-Patcher 的 connect.py）。
; 留空则运行时提示输入（不会写入文件）。
stock_web_password =
; 刷好 ImmortalWrt 后要设置的 root 密码（留空 = root，建议改成你自己的）
new_root_password =

[options]
; 已经是 1.0.18 时跳过降级
skip_downgrade_if_version_matches = yes
; 第 4 步安装哪些东西
install_argon = yes
install_openclash = yes
install_smartdns = yes
install_zh_cn = yes
; 写 bootloader(mtd1/mtd7) 前是否再次确认
confirm_bootloader = yes
; 结束后是否删除电脑上的临时 IP 192.168.1.10
remove_temp_ip = yes
; 等待设备重启的时间（秒）
reboot_timeout = 600
